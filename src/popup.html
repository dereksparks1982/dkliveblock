<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DK Live Block</title><link rel="stylesheet" href="style.css"></head>
<body class="popup">
<header><strong>DK LIVE BLOCK</strong><small>Development build</small></header>
<main><div class="metric"><b id="count">0</b> blocked on this tab</div>
<label class="row">Protection everywhere <input id="enabled" type="checkbox"></label>
<div class="row"><span id="site">Current site</span><button id="toggle">Pause on site</button></div>
<div class="row"><span>Only this tab</span><button id="temporary">Pause this tab</button></div>
<div class="row" id="mediaRecoveryRow" hidden><span>Playback Rescue</span><button id="mediaRecovery">Enable media rescue</button></div>
<p id="mediaWarning" hidden>Allows media requests on this site. Some video ads may play.</p>
<div class="row"><span>Failed resources: <b id="issues">0</b></span><button id="recovery">Network recovery</button></div>
<div class="row"><button id="picker">Hide an element</button><button id="undo">Undo hide</button><button id="update">Update lists</button></div>
<p id="info" role="status">Loading…</p><button id="settings" class="full">Settings, privacy and logs</button></main>
<footer>No account · No telemetry · No paywall</footer><script src="popup.js"></script></body></html>
